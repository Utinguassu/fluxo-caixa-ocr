<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TingaSystem - Fluxo de Caixa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex items-center justify-center h-screen font-sans bg-cover bg-center relative" style="background-image: url('https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?q=80&w=1200&auto=format&fit=crop');">
    
    <!-- Máscara escura para dar leitura -->
    <div class="absolute inset-0 bg-gray-900/60"></div>

    <!-- Container Vidro -->
    <div class="relative w-full max-w-md p-10 bg-white/10 backdrop-blur-lg border border-white/20 rounded-3xl shadow-2xl mx-4">
        
        <h2 class="text-2xl font-semibold mb-8 text-center text-white leading-snug">
            Bem-vindo ao projeto de<br>fluxo de caixa
        </h2>
        
        <form id="loginForm" class="space-y-5">
            <div>
                <label for="email" class="block text-gray-200 font-medium mb-2 text-sm">E-mail</label>
                <input type="email" id="email" required
                    class="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-xl text-white placeholder-gray-300 focus:bg-white/30 focus:outline-none focus:ring-2 focus:ring-teal-400 transition-all">
            </div>
            
            <div>
                <label for="senha" class="block text-gray-200 font-medium mb-2 text-sm">Senha (6 dígitos)</label>
                <input type="password" id="senha" required minlength="6" maxlength="6"
                    class="w-full px-4 py-3 bg-white/20 border border-white/30 rounded-xl text-white placeholder-gray-300 focus:bg-white/30 focus:outline-none focus:ring-2 focus:ring-teal-400 transition-all">
            </div>
            
            <button type="submit" class="w-full bg-teal-500 text-white font-bold py-3 px-4 rounded-xl hover:bg-teal-400 focus:ring-4 focus:ring-teal-300/50 transition-all shadow-lg mt-4 border border-teal-400">
                Acessar Sistema
            </button>
            <div class="mt-6 text-center">
    <p class="text-sm text-gray-300">
        Não tem cadastro? 
        <a href="/cadastro" class="text-emerald-400 font-semibold hover:text-emerald-300 hover:underline transition-colors">
            Clique aqui
        </a>
    </p>
</div>
        </form>

        <!-- Rodapé / Assinatura -->
        <div class="mt-10 text-center">
            <p class="text-gray-400 text-xs font-medium tracking-widest uppercase">
                Desenvolvido By TingaSystem - PO and QA
            </p>
        </div>
    </div>

    <!-- Script de Autenticação -->
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            
            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, senha_pin: senha })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    localStorage.setItem('token', data.access_token);
                    window.location.href = '/dashboard';
                } else {
                    alert('Acesso negado: ' + (data.erro || 'Verifique seus dados.'));
                }
            } catch (error) {
                console.error('Erro de comunicação:', error);
                alert('Erro ao conectar com o servidor.');
            }
        });
    </script>
</body>
</html>
