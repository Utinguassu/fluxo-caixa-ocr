<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Fluxo de Caixa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; }
    </style>
</head>
<body class="font-sans antialiased p-4 md:p-6 min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="w-full max-w-4xl mx-auto flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <h1 class="text-2xl font-bold text-emerald-400">Meu Caixa</h1>
        <button onclick="sair()" class="text-sm text-gray-400 hover:text-white cursor-pointer">Sair</button>
    </header>

    <!-- Cards RN03 - Otimizados para Mobile (iPhone) e Responsivos -->
    <main class="w-full max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6 flex-1">
        
        <!-- Card Saldo Inicial -->
        <div class="bg-gray-800/80 p-5 rounded-2xl border border-gray-700 shadow-sm flex flex-col justify-between h-28">
            <h3 class="text-gray-400 text-xs font-semibold uppercase tracking-wider">Saldo Inicial</h3>
            <p id="cardSaldoInicial" class="text-xl md:text-2xl font-medium text-gray-200">R$ 0,00</p>
        </div>

        <!-- Card Total de Débitos -->
        <div class="bg-gray-800/80 p-5 rounded-2xl border border-gray-700 shadow-sm flex flex-col justify-between h-28">
            <h3 class="text-gray-400 text-xs font-semibold uppercase tracking-wider">Total de Débitos</h3>
            <p id="cardDebitos" class="text-xl md:text-2xl font-medium text-red-400">R$ 0,00</p>
        </div>

        <!-- Card Saldo Atualizado (Destaque Principal) -->
        <div class="bg-emerald-900/30 p-6 rounded-2xl border border-emerald-500/40 shadow-lg flex flex-col justify-between h-32 md:h-auto md:row-span-2">
            <h3 class="text-emerald-400 text-xs font-semibold uppercase tracking-wider">Saldo Atualizado</h3>
            <p id="cardSaldoAtual" class="text-4xl md:text-3xl font-bold text-emerald-400 mt-2">R$ 0,00</p>
        </div>
        
    </main>

    <!-- Modal Obrigatório RN05 (Inicia oculto - Bloqueia no 1º acesso) -->
    <div id="modalSaldoInicial" class="fixed inset-0 bg-black/90 z-50 flex items-center justify-center hidden p-4">
        <div class="bg-gray-900 p-6 md:p-8 rounded-2xl border border-gray-700 w-full max-w-sm text-center shadow-2xl">
            <h2 class="text-xl font-bold text-emerald-400 mb-2">Bem-vindo!</h2>
            <p class="text-sm text-gray-400 mb-6">Para começarmos, informe seu saldo atual em conta.</p>
            
            <input type="number" id="inputNovoSaldo" step="0.01" placeholder="Ex: 1500.00"
                class="w-full px-4 py-3 bg-black/50 border border-gray-600 rounded-lg text-white mb-4 focus:outline-none focus:border-emerald-400 text-center text-lg">
            
            <button id="btnSalvarSaldo" onclick="salvarSaldo()"
                class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-lg transition-colors cursor-pointer shadow-lg">
                Definir Saldo Inicial
            </button>
        </div>
    </div>

    <!-- Scripts de Controle -->
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/'; 

        const formatarMoeda = (valor) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);

        async function carregarDashboard() {
            try {
                const response = await fetch('/api/saldo', {
                    headers: { 'Authorization': `Bearer ${token}` }
                });
                
                if (response.status === 401 || response.status === 403) {
                    sair(); return;
                }

                const data = await response.json();

                if (data.precisa_saldo_inicial) {
                    document.getElementById('modalSaldoInicial').classList.remove('hidden');
                } else {
                    document.getElementById('modalSaldoInicial').classList.add('hidden');
                    document.getElementById('cardSaldoInicial').innerText = formatarMoeda(data.saldo_inicial);
                    document.getElementById('cardDebitos').innerText = formatarMoeda(data.total_debitos);
                    document.getElementById('cardSaldoAtual').innerText = formatarMoeda(data.saldo_atualizado);
                }
            } catch (error) {
                console.error("Erro ao carregar dashboard", error);
            }
        }

        async function salvarSaldo() {
            const valor = document.getElementById('inputNovoSaldo').value;
            if (!valor) return alert('Digite um valor válido.');

            const response = await fetch('/api/saldo', {
                method: 'POST',
                headers: { 
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}` 
                },
                body: JSON.stringify({ valor: parseFloat(valor) })
            });

            if (response.ok) {
                carregarDashboard(); 
            } else {
                alert('Erro ao salvar saldo.');
            }
        }

        function sair() {
            localStorage.removeItem('token');
            window.location.href = '/';
        }

        carregarDashboard();
    </script>
</body>
</html>
