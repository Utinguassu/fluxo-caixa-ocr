<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Fluxo de Caixa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: white; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="font-sans antialiased p-4 md:p-6 min-h-screen flex flex-col">

    <!-- Cabeçalho -->
    <header class="w-full max-w-4xl mx-auto flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <h1 class="text-2xl font-bold text-emerald-400">Meu Caixa</h1>
        <button onclick="sair()" class="text-sm text-gray-400 hover:text-white transition-colors cursor-pointer flex items-center gap-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Sair
        </button>
    </header>

    <!-- Cards RN03 -->
    <main class="w-full max-w-4xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-4 md:gap-6">
        <div class="bg-gray-800/80 p-5 rounded-2xl border border-gray-700 shadow-sm flex flex-col justify-between h-28 hover:border-gray-600 transition-colors">
            <h3 class="text-gray-400 text-xs font-semibold uppercase tracking-wider">Saldo Inicial</h3>
            <p id="cardSaldoInicial" class="text-xl md:text-2xl font-medium text-gray-200">R$ 0,00</p>
        </div>
        <div class="bg-gray-800/80 p-5 rounded-2xl border border-gray-700 shadow-sm flex flex-col justify-between h-28 hover:border-gray-600 transition-colors">
            <h3 class="text-gray-400 text-xs font-semibold uppercase tracking-wider">Total de Débitos</h3>
            <p id="cardDebitos" class="text-xl md:text-2xl font-medium text-red-400">R$ 0,00</p>
        </div>
        <div class="bg-gradient-to-br from-emerald-900/40 to-emerald-900/10 p-6 rounded-2xl border border-emerald-500/40 shadow-lg flex flex-col justify-between h-32 md:h-auto md:row-span-2 relative overflow-hidden">
            <div class="absolute top-0 right-0 -mr-8 -mt-8 w-32 h-32 rounded-full bg-emerald-500/10 blur-2xl"></div>
            <h3 class="text-emerald-400 text-xs font-semibold uppercase tracking-wider relative z-10">Saldo Atualizado</h3>
            <p id="cardSaldoAtual" class="text-4xl md:text-3xl font-bold text-emerald-400 mt-2 relative z-10">R$ 0,00</p>
        </div>
    </main>

    <!-- Linha do Tempo / Extrato (RN04) -->
    <section class="w-full max-w-4xl mx-auto mt-10 flex-1 flex flex-col">
        <div class="flex justify-between items-end mb-6">
            <div>
                <h2 class="text-xl font-bold text-gray-100">Linha do Tempo</h2>
                <p class="text-sm text-gray-400 mt-1">O seu histórico de lançamentos</p>
            </div>
            <div class="bg-gray-800/50 px-3 py-1 rounded-full border border-gray-700">
                <span class="text-xs text-gray-300 font-medium">Recentes primeiro</span>
            </div>
        </div>

        <div id="listaExtrato" class="space-y-3 pb-8">
            <!-- Skeleton Loading PRO -->
            <div id="loadingExtrato" class="animate-pulse space-y-3">
                <div class="h-20 bg-gray-800/40 rounded-xl w-full border border-gray-700/30"></div>
                <div class="h-20 bg-gray-800/40 rounded-xl w-full border border-gray-700/30"></div>
            </div>
        </div>
    </section>

    <!-- Modal Obrigatório RN05 -->
    <div id="modalSaldoInicial" class="fixed inset-0 bg-black/90 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 transition-opacity duration-300">
        <div class="bg-gray-900 p-6 md:p-8 rounded-2xl border border-gray-700 w-full max-w-sm text-center shadow-2xl">
            <h2 class="text-xl font-bold text-emerald-400 mb-2">Bem-vindo!</h2>
            <p class="text-sm text-gray-400 mb-6">Para começarmos, informe o seu saldo atual em conta.</p>
            <input type="number" id="inputNovoSaldo" step="0.01" placeholder="Ex: 1500.00" class="w-full px-4 py-3 bg-black/50 border border-gray-600 rounded-lg text-white mb-4 focus:outline-none focus:ring-2 focus:ring-emerald-500/50 focus:border-emerald-400 text-center text-lg">
            <button id="btnSalvarSaldo" onclick="salvarSaldo()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-lg transition-colors cursor-pointer shadow-lg">Definir Saldo Inicial</button>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        const token = localStorage.getItem('token');
        if (!token) window.location.href = '/'; 

        const formatarMoeda = (valor) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(valor);
        const formatarData = (dataString) => {
            if (!dataString) return '';
            const data = new Date(dataString);
            // Ajuste simples de fuso para não dar diferença de 1 dia dependendo do horário
            data.setMinutes(data.getMinutes() + data.getTimezoneOffset());
            return new Intl.DateTimeFormat('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' }).format(data);
        };

        const getIconeTipo = (tipo) => {
            if (tipo.includes('CART')) return `<div class="p-2 bg-indigo-500/20 rounded-lg border border-indigo-500/30"><svg class="w-5 h-5 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z"></path></svg></div>`;
            return `<div class="p-2 bg-emerald-500/20 rounded-lg border border-emerald-500/30"><svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg></div>`;
        };

        async function carregarDashboard() {
            try {
                const response = await fetch('/api/saldo', { headers: { 'Authorization': `Bearer ${token}` } });
                if (response.status === 401 || response.status === 403) return sair();
                const data = await response.json();

                if (data.precisa_saldo_inicial) {
                    document.getElementById('modalSaldoInicial').classList.remove('hidden');
                    document.getElementById('listaExtrato').innerHTML = ''; // Limpa o skeleton
                } else {
                    document.getElementById('modalSaldoInicial').classList.add('hidden');
                    document.getElementById('cardSaldoInicial').innerText = formatarMoeda(data.saldo_inicial);
                    document.getElementById('cardDebitos').innerText = formatarMoeda(data.total_debitos);
                    document.getElementById('cardSaldoAtual').innerText = formatarMoeda(data.saldo_atualizado);
                    carregarExtrato(); 
                }
            } catch (error) { console.error("Erro ao carregar saldo", error); }
        }

        async function carregarExtrato() {
            const container = document.getElementById('listaExtrato');
            try {
                const response = await fetch('/api/extrato', { headers: { 'Authorization': `Bearer ${token}` } });
                if (!response.ok) throw new Error('Falha ao buscar extrato');
                const data = await response.json();
                
                if (data.lancamentos.length === 0) {
                    container.innerHTML = `
                        <div class="bg-gray-800/40 border border-gray-700/50 p-8 rounded-2xl text-center flex flex-col items-center justify-center">
                            <svg class="w-12 h-12 text-gray-600 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                            <p class="text-gray-400 text-sm font-medium">Nenhum lançamento registado.</p>
                            <p class="text-gray-500 text-xs mt-1">Os seus gastos aparecerão aqui.</p>
                        </div>`;
                    return;
                }

                container.innerHTML = data.lancamentos.map(item => `
                    <div class="bg-gray-800/60 p-4 rounded-2xl border border-gray-700/60 flex justify-between items-center shadow-sm hover:bg-gray-800/80 transition-colors group">
                        <div class="flex items-center gap-4">
                            ${getIconeTipo(item.tipo)}
                            <div class="flex flex-col text-left">
                                <span class="text-sm font-semibold text-gray-200 group-hover:text-white transition-colors">${item.estabelecimento}</span>
                                <span class="text-xs text-gray-400 mt-0.5">${item.tipo} • ${formatarData(item.data)}</span>
                            </div>
                        </div>
                        <span class="text-red-400 font-bold text-sm tracking-wide">- ${formatarMoeda(item.valor)}</span>
                    </div>
                `).join('');

            } catch (error) {
                container.innerHTML = `<div class="p-4 text-center text-red-400 text-sm bg-red-900/10 border border-red-900/30 rounded-xl">Erro ao carregar histórico.</div>`;
            }
        }

        async function salvarSaldo() {
            const btn = document.getElementById('btnSalvarSaldo');
            const valor = document.getElementById('inputNovoSaldo').value;
            if (!valor) return alert('Digite um valor válido.');

            btn.innerText = "A guardar..."; btn.disabled = true;
            const response = await fetch('/api/saldo', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
                body: JSON.stringify({ valor: parseFloat(valor) })
            });
            btn.innerText = "Definir Saldo Inicial"; btn.disabled = false;

            if (response.ok) carregarDashboard(); 
            else alert('Erro ao guardar saldo.');
        }

        function sair() {
            localStorage.removeItem('token');
            window.location.href = '/';
        }

        carregarDashboard();
    </script>
</body>
</html>
