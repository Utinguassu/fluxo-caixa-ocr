name: Suíte de Testes Automatizados

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    - cron: '0 0 * * *'

jobs:
  testar_aplicacao:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET_KEY: "test-secret-key-environment-isolated-2026"

    steps:
    - name: Baixar o código do repositório
      uses: actions/checkout@v4

    - name: Configurar o Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Instalar Tesseract OCR no Servidor
      run: |
        sudo apt-get update
        sudo apt-get install -y tesseract-ocr

    - name: Instalar dependências do projeto
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -m pip check

    - name: Instalar Chrome e FFmpeg do Playwright
      run: python -m playwright install --with-deps chrome ffmpeg

    - name: Executar Suíte de Testes
      run: |
        python -m flask --app backend.app run --host 127.0.0.1 --port 5000 > /tmp/fluxo-caixa-server.log 2>&1 &
        server_pid=$!
        trap 'kill "$server_pid" 2>/dev/null || true' EXIT

        for attempt in $(seq 1 30); do
          if curl --silent --fail http://127.0.0.1:5000/ > /dev/null; then
            break
          fi
          sleep 1
        done

        if ! curl --silent --fail http://127.0.0.1:5000/ > /dev/null; then
          cat /tmp/fluxo-caixa-server.log
          exit 1
        fi

        python -m pytest

    - name: Salvar relatórios e evidências como artefato
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: relatorios-e-evidencias-${{ github.run_number }}
        path: |
          relatorios/
        if-no-files-found: warn